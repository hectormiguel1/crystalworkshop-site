# Generated by scripts/generate.mjs from the release data (npm run generate). Do not edit by hand.
name: Problem with a mod
description: Something in one of the mods does not work as described.
title: "[Mod] "
labels:
  - mod
  - needs-triage
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please check the mod's page and [Troubleshooting](https://hectormiguel1.github.io/crystalworkshop-site/pulsedepot/troubleshooting/) first. One problem per report, please. Mods by other authors are reported to their authors.
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      description: Which mod is it about?
      options:
        - Accessorize (FF XIII)
        - XIII-2 — Accessorize (FF XIII-2)
        - Crystal Clear (FF XIII)
        - Honey, I Shrunk the HUD (FF XIII)
        - XIII-2 — Honey, I Shrunk the HUD (FF XIII-2)
        - XIII — Loot Your Way (FF XIII)
        - LIGHTNING RETURNS — Loot Your Way (FF XIII / LR)
        - XIII-2 — Loot Your Way (FF XIII-2)
        - No Post-Battle Healing (FF XIII)
        - XIII — Pain Your Way (FF XIII)
        - LIGHTNING RETURNS — Pain Your Way (FF XIII / LR)
        - XIII-2 — Pain Your Way (FF XIII-2)
        - Paradigm Tuning (FF XIII)
        - Seventh Ark (FF XIII)
        - Strike a Pose (FF XIII)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The mod version, shown in PulseDepot’s mod details.
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game
      description: The game you play it with.
      options:
        - FINAL FANTASY XIII
        - FINAL FANTASY XIII-2
        - "LIGHTNING RETURNS: FINAL FANTASY XIII"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where you play.
      options:
        - Windows
        - Linux (Proton)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Steps that make it happen again help the most.
      placeholder: |-
        1. I did …
        2. I expected …
        3. Instead …
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag and drop an image here, or paste it.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Optional. Paste the end of `Crux.jsonl` (in the `addons` folder beside the game executable). **Check before you paste.** Logs such as `Crux.jsonl` can contain your user name or folder paths. Replace them (for example with `USER`) and remove anything else personal.
      render: text
    validations:
      required: false
