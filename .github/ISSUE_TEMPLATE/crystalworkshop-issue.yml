# Generated by scripts/generate.mjs from the release data (npm run generate). Do not edit by hand.
name: Problem with CrystalWorkshop
description: CrystalWorkshop, the modding editor, does not work as described.
title: "[CrystalWorkshop] "
labels:
  - crystalworkshop
  - needs-triage
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please check [the CrystalWorkshop FAQ](https://hectormiguel1.github.io/crystalworkshop-site/crystalworkshop/faq/) first. One problem per report, please.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of CrystalWorkshop is it about?
      options:
        - Installing or first run
        - Sheets and SQL (DB)
        - Text (ZTR)
        - Crystarium
        - Models
        - VFX
        - Scenes (LYB)
        - Scripts, actions and sound
        - Exporting a .cws shard
        - AI clients (MCP)
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The CrystalWorkshop version (the current release is 0.1.0-alpha).
      placeholder: e.g. 0.1.0-alpha
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game
      description: The game you mod.
      options:
        - FINAL FANTASY XIII
        - FINAL FANTASY XIII-2
        - "LIGHTNING RETURNS: FINAL FANTASY XIII"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where you run CrystalWorkshop.
      options:
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Steps that make it happen again help the most.
      placeholder: |-
        1. I did …
        2. I expected …
        3. Instead …
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag and drop an image here, or paste it.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Optional. Paste the error message or the end of the log the app shows. **Check before you paste.** Logs such as `Crux.jsonl` can contain your user name or folder paths. Replace them (for example with `USER`) and remove anything else personal.
      render: text
    validations:
      required: false
