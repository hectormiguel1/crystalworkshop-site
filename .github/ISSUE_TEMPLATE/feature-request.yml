      required: true
  - type: textarea
    id: description
    attributes:
      label: Your idea
      description: What you would like, and what it would help you do.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag and drop an image here, or paste it.
    validations:
      required: false
