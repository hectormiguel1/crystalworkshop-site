# Generated by scripts/generate.mjs from the release data (npm run generate). Do not edit by hand.
name: Problem with PulseDepot
description: PulseDepot, the mod manager, does not work as described.
title: "[PulseDepot] "
labels:
  - pulsedepot
  - needs-triage
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please check [the PulseDepot FAQ](https://hectormiguel1.github.io/crystalworkshop-site/pulsedepot/faq/) first. One problem per report, please.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of PulseDepot is it about?
      options:
        - Installing or starting PulseDepot
        - First setup (game folder, how Crux runs)
        - Adding shard mods (.cws)
        - Adding Nova Chrysalia mods (.ncmp)
        - Load order, enabling and conflicts
        - Review and apply
        - Launching the game
        - Updating or removing mods
        - Uninstalling
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The PulseDepot version (the current release is 0.1.0-beta).
      placeholder: e.g. 0.1.0-beta
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game
      description: The game you mod.
      options:
        - FINAL FANTASY XIII
        - FINAL FANTASY XIII-2
        - "LIGHTNING RETURNS: FINAL FANTASY XIII"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where you run PulseDepot.
      options:
        - Windows
        - Linux (Proton)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Steps that make it happen again help the most.
      placeholder: |-
        1. I did …
        2. I expected …
        3. Instead …
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag and drop an image here, or paste it.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Optional. Copy the status line and paste the end of `Crux.jsonl` if the game is involved. **Check before you paste.** Logs such as `Crux.jsonl` can contain your user name or folder paths. Replace them (for example with `USER`) and remove anything else personal.
      render: text
    validations:
      required: false
