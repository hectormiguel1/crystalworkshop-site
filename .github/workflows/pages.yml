# GitHub Pages deployment for the PUBLIC site repository (not active in the
# private repository: it lives under site/deploy-template/). Copy it to
# .github/workflows/pages.yml at the root of the public repository.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # The generated pages and data are committed; this only builds them.
      - run: npm run build:site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_OUT_DIR: ./dist
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - run: node scripts/check-links.mjs dist
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: node scripts/check-terms.mjs dist
      # Issue status and roadmap (see status.yml), so a push keeps them current.
      - run: node scripts/status.mjs dist/api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
